<ul class="attributes-list">
    <li class="attribute-row">
        <span class="attribute-row__label">{{localize 'gfl5r.attributes.endurance'}}</span>
        <input class="centered-input select-on-focus" type="number" name="system.endurance" value="{{data.system.endurance}}" data-dtype="Number" min="0" placeholder="0" {{^if data.editable}}disabled{{/if}}/>
    </li>
    <li class="attribute-row">
        <span class="attribute-row__label">{{localize 'gfl5r.attributes.composure'}}</span>
        <input class="centered-input select-on-focus" type="number" name="system.composure" value="{{data.system.composure}}" data-dtype="Number" min="0" placeholder="0" {{^if data.editable}}disabled{{/if}}/>
    </li>
    <li class="attribute-row">
        <span class="attribute-row__label">{{localize 'gfl5r.attributes.focus'}}</span>
        <input class="centered-input select-on-focus" type="number" name="system.focus" value="{{data.system.focus}}" data-dtype="Number" min="0" placeholder="0" {{^if data.editable}}disabled{{/if}}/>
    </li>
    <li class="attribute-row {{#if data.system.is_afflicted_or_compromised}}compromised{{/if}}">
        <span class="attribute-row__label">{{localize 'gfl5r.attributes.vigilance'}}</span>
        {{#if data.system.is_afflicted_or_compromised}}
        <input class="centered-input" type="number" value="1" disabled/>
        {{else}}
        <input class="centered-input select-on-focus" type="number" name="system.vigilance" value="{{data.system.vigilance}}" data-dtype="Number" min="0" placeholder="0" {{^if data.editable}}disabled{{/if}}/>
        {{/if}}
    </li>
</ul>
