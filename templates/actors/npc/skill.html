<div class="gfl-panel npc-skills-panel">
    <div class="discipline-card__corner discipline-card__corner--tl"></div>
    <div class="discipline-card__corner discipline-card__corner--tr"></div>
    <div class="discipline-card__corner discipline-card__corner--bl"></div>
    <div class="discipline-card__corner discipline-card__corner--br"></div>
    <div class="gfl-panel__header">
        <span class="gfl-panel__label">{{localize 'gfl5r.skills.title'}}</span>
    </div>
    <div class="gfl-panel__body">
        <ul class="npc-skills-row">
            {{#each data.skillGroups as |group|}}
            <li class="npc-skill-card" data-category-id="{{group.id}}">
                <div class="npc-skill-card__header">
                    <span class="npc-skill-card__title dice-picker rollable" data-skillcat="{{group.id}}">{{localize group.label}}</span>
                </div>
                <div class="npc-skill-card__body">
                    <input
                        class="npc-skill-card__value centered-input select-on-focus"
                        type="number"
                        name="system.skills.{{group.id}}"
                        value="{{group.rank}}"
                        data-dtype="Number"
                        min="0"
                        max="9"
                        placeholder="0"
                        {{^if ../data.editable}}disabled{{/if}}
                    />
                </div>
            </li>
            {{/each}}
        </ul>
    </div>
</div>
