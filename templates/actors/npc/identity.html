<div class="identity-fields">
    <div class="identity-field">
        <span class="identity-field__label">{{localize 'gfl5r.npc.title'}}</span>
        <select name="system.threat_level" {{^if data.editable}}disabled{{/if}}>
            {{#each data.threatLevels as |entry|}}
            <option value="{{entry.id}}" {{#ifCond ../data.system.threat_level '==' entry.id}}selected{{/ifCond}}>{{entry.label}}</option>
            {{/each}}
        </select>
    </div>
</div>
