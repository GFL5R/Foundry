<form class="gfl5r gm-toolbox" autocomplete="off">
    <ul class="gm-tools-container">
        <li class="gm_monitor" data-action="open_gm_monitor" title="{{localize 'gfl5r.gm.monitor.title'}}">
            <i class="fas fa-table"></i>
        </li>
        <li class="difficulty_hidden" data-action="toggle_hide_difficulty" title="{{localize 'gfl5r.gm.toolbox.difficulty_hidden'}}">
            <i class="fa fa-eye{{#if difficultyHidden}}-slash{{/if}}"></i>
            <strong class="difficulty" data-action="change_difficulty" title="{{localize 'gfl5r.gm.toolbox.difficulty'}}">{{difficulty}}</strong>
        </li>
        <li class="gm_actor_updates reset_fortune" data-action="reset_fortune" title="{{localize 'gfl5r.gm.toolbox.reset_fortune'}}">
            <i class="fas fa-podcast"></i>
        </li>
        <li class="gm_actor_updates sleep" data-action="sleep" title="{{localize 'gfl5r.gm.toolbox.sleep'}}">
            <i class="fa fa-bed"></i>
        </li>
        <li class="gm_actor_updates scene_end" data-action="scene_end" title="{{localize 'gfl5r.gm.toolbox.scene_end'}}">
            <i class="fas fa-star-half-alt"></i>
        </li>
    </ul>
</form>
