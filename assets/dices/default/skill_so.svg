<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40"><defs><clipPath id="face-clip"><polygon points="20,2.5 2.26,16.05 9.04,37.98 30.96,37.98 37.74,16.05"/></clipPath><filter id="s-glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
<filter id="o-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="o-outerglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="o-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ff9900" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06090d" stop-opacity="0"/>
    </radialGradient>
    <!-- Per-petal gradient: bright at tip, darker at base -->
    <linearGradient id="o-petal-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#7a3800"/>
      <stop offset="60%"  stop-color="#5a2600"/>
      <stop offset="100%" stop-color="#3a1400"/>
    </linearGradient></defs><polygon points="20,2.5 2.26,16.05 9.04,37.98 30.96,37.98 37.74,16.05" fill="#FFFFFF" stroke="#000000" stroke-width="1" stroke-miterlimit="10"/><g clip-path="url(#face-clip)"><g transform="translate(24,15) scale(0.1512) translate(-60,-60)"><g transform="translate(60,60)" filter="url(#s-glow)">

    <!-- Outer ring: mostly solid, small gaps at N/E/S/W -->
    <!-- Arc = 80°, gap = 10°, centered so gaps fall exactly on cardinals -->
    <!-- Gaps at 0°(top), 90°(right), 180°(bottom), 270°(left)          -->
    <!-- So arcs run: 5°→85°, 95°→175°, 185°→265°, 275°→355°           -->
    <g fill="none" stroke="#00ffe0" stroke-width="2" stroke-linecap="butt">
      <path d="M 6.6,-37.4 A 38,38 0 0,1 37.4,-6.6"   />
      <path d="M 37.4,6.6  A 38,38 0 0,1 6.6,37.4"    />
      <path d="M -6.6,37.4 A 38,38 0 0,1 -37.4,6.6"   />
      <path d="M -37.4,-6.6 A 38,38 0 0,1 -6.6,-37.4" />
    </g>

    <!-- Tick marks sitting in the gaps at each cardinal, pointing inward -->
    <g stroke="#00ffe0" stroke-width="2.5" stroke-linecap="square">
      <line x1="0" y1="-38" x2="0" y2="-27" transform="rotate(0)"/>
      <line x1="0" y1="-38" x2="0" y2="-27" transform="rotate(90)"/>
      <line x1="0" y1="-38" x2="0" y2="-27" transform="rotate(180)"/>
      <line x1="0" y1="-38" x2="0" y2="-27" transform="rotate(270)"/>
    </g>

    <!-- Inner ring, solid -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="#00ffe0" stroke-width="1.2" opacity="0.65"/>

    <!-- 4 inner ticks -->
    <g stroke="#00ffe0" stroke-width="1.5" stroke-linecap="square">
      <line x1="0" y1="-22" x2="0" y2="-15" transform="rotate(0)"/>
      <line x1="0" y1="-22" x2="0" y2="-15" transform="rotate(90)"/>
      <line x1="0" y1="-22" x2="0" y2="-15" transform="rotate(180)"/>
      <line x1="0" y1="-22" x2="0" y2="-15" transform="rotate(270)"/>
    </g>

    <!-- Center -->
    <circle cx="0" cy="0" r="7" fill="none" stroke="#00ffe0" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="0" r="3" fill="#00ffe0"/>

  </g></g><g transform="translate(15,29) scale(0.16) translate(-60,-60)"><g transform="translate(60,60)">
    <circle cx="0" cy="0" r="55" fill="url(#o-bg-glow)"/>

    <!-- Outer bloom -->
    <g filter="url(#o-outerglow)" opacity="0.5">
      <path d="M-4,-7 C-11,-18 -8,-40 0,-48 C8,-40 11,-18 4,-7 Z" fill="#ffaa00" transform="rotate(0)"/>
      <path d="M-4,-7 C-11,-18 -8,-40 0,-48 C8,-40 11,-18 4,-7 Z" fill="#ffaa00" transform="rotate(60)"/>
      <path d="M-4,-7 C-11,-18 -8,-40 0,-48 C8,-40 11,-18 4,-7 Z" fill="#ffaa00" transform="rotate(120)"/>
      <path d="M-4,-7 C-11,-18 -8,-40 0,-48 C8,-40 11,-18 4,-7 Z" fill="#ffaa00" transform="rotate(180)"/>
      <path d="M-4,-7 C-11,-18 -8,-40 0,-48 C8,-40 11,-18 4,-7 Z" fill="#ffaa00" transform="rotate(240)"/>
      <path d="M-4,-7 C-11,-18 -8,-40 0,-48 C8,-40 11,-18 4,-7 Z" fill="#ffaa00" transform="rotate(300)"/>
    </g>

    <!-- Petals: narrower, sharper tip -->
    <g filter="url(#o-glow)">
      <path d="M-4,-7 C-11,-18 -8,-40 0,-48 C8,-40 11,-18 4,-7 Z"
            fill="url(#o-petal-grad)" stroke="#ffaa00" stroke-width="1.6" stroke-linejoin="round" transform="rotate(0)"/>
      <path d="M-4,-7 C-11,-18 -8,-40 0,-48 C8,-40 11,-18 4,-7 Z"
            fill="url(#o-petal-grad)" stroke="#ffaa00" stroke-width="1.6" stroke-linejoin="round" transform="rotate(60)"/>
      <path d="M-4,-7 C-11,-18 -8,-40 0,-48 C8,-40 11,-18 4,-7 Z"
            fill="url(#o-petal-grad)" stroke="#ffaa00" stroke-width="1.6" stroke-linejoin="round" transform="rotate(120)"/>
      <path d="M-4,-7 C-11,-18 -8,-40 0,-48 C8,-40 11,-18 4,-7 Z"
            fill="url(#o-petal-grad)" stroke="#ffaa00" stroke-width="1.6" stroke-linejoin="round" transform="rotate(180)"/>
      <path d="M-4,-7 C-11,-18 -8,-40 0,-48 C8,-40 11,-18 4,-7 Z"
            fill="url(#o-petal-grad)" stroke="#ffaa00" stroke-width="1.6" stroke-linejoin="round" transform="rotate(240)"/>
      <path d="M-4,-7 C-11,-18 -8,-40 0,-48 C8,-40 11,-18 4,-7 Z"
            fill="url(#o-petal-grad)" stroke="#ffaa00" stroke-width="1.6" stroke-linejoin="round" transform="rotate(300)"/>
    </g>

    <!-- Midrib spine: bright line up the center of each petal -->
    <g stroke="#ffdd55" stroke-width="1.2" opacity="0.85" stroke-linecap="round">
      <line x1="0" y1="-8"  x2="0" y2="-46" transform="rotate(0)"/>
      <line x1="0" y1="-8"  x2="0" y2="-46" transform="rotate(60)"/>
      <line x1="0" y1="-8"  x2="0" y2="-46" transform="rotate(120)"/>
      <line x1="0" y1="-8"  x2="0" y2="-46" transform="rotate(180)"/>
      <line x1="0" y1="-8"  x2="0" y2="-46" transform="rotate(240)"/>
      <line x1="0" y1="-8"  x2="0" y2="-46" transform="rotate(300)"/>
    </g>

    <!-- Side veins: angled circuit-trace style, like a Y fork -->
    <g stroke="#ff9900" stroke-width="0.9" opacity="0.65" stroke-linecap="round">
      <line x1="0" y1="-20" x2="-6" y2="-30" transform="rotate(0)"/>
      <line x1="0" y1="-20" x2=" 6" y2="-30" transform="rotate(0)"/>
      <line x1="0" y1="-20" x2="-6" y2="-30" transform="rotate(60)"/>
      <line x1="0" y1="-20" x2=" 6" y2="-30" transform="rotate(60)"/>
      <line x1="0" y1="-20" x2="-6" y2="-30" transform="rotate(120)"/>
      <line x1="0" y1="-20" x2=" 6" y2="-30" transform="rotate(120)"/>
      <line x1="0" y1="-20" x2="-6" y2="-30" transform="rotate(180)"/>
      <line x1="0" y1="-20" x2=" 6" y2="-30" transform="rotate(180)"/>
      <line x1="0" y1="-20" x2="-6" y2="-30" transform="rotate(240)"/>
      <line x1="0" y1="-20" x2=" 6" y2="-30" transform="rotate(240)"/>
      <line x1="0" y1="-20" x2="-6" y2="-30" transform="rotate(300)"/>
      <line x1="0" y1="-20" x2=" 6" y2="-30" transform="rotate(300)"/>
    </g>

    <!-- Hexagonal ring at petal bases -->
    <polygon points="0,-12 10.4,-6 10.4,6 0,12 -10.4,6 -10.4,-6"
             fill="none" stroke="#ffaa00" stroke-width="1.2" opacity="0.6"/>

    <!-- Small dot at each petal tip — circuit node -->
    <g fill="#ffcc44" opacity="0.9">
      <circle cx="0" cy="-48" r="2" transform="rotate(0)"/>
      <circle cx="0" cy="-48" r="2" transform="rotate(60)"/>
      <circle cx="0" cy="-48" r="2" transform="rotate(120)"/>
      <circle cx="0" cy="-48" r="2" transform="rotate(180)"/>
      <circle cx="0" cy="-48" r="2" transform="rotate(240)"/>
      <circle cx="0" cy="-48" r="2" transform="rotate(300)"/>
    </g>

    <!-- Center core -->
    <circle cx="0" cy="0" r="10" fill="#ff8800" opacity="0.2"/>
    <circle cx="0" cy="0" r="7"  fill="#cc5500"/>
    <circle cx="0" cy="0" r="4"  fill="#ffcc44"/>
    <circle cx="0" cy="0" r="1.8" fill="#ffffff"/>
  </g></g></g></svg>