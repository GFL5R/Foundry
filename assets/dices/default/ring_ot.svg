<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40"><defs><filter id="o-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="o-outerglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="o-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ff9900" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06090d" stop-opacity="0"/>
    </radialGradient>
    <!-- Per-petal gradient: bright at tip, darker at base -->
    <linearGradient id="o-petal-grad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#7a3800"/>
      <stop offset="60%"  stop-color="#5a2600"/>
      <stop offset="100%" stop-color="#3a1400"/>
    </linearGradient>
<filter id="st-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="st-outerglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="st-vein-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ff0020" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06090d" stop-opacity="0"/>
    </radialGradient>
