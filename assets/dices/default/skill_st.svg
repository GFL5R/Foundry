    <!-- 
      Highlight: wide soft stroke tracing the outer edge of each arm.
      The outer edge IS the stroke of each path, so just re-draw each path
      with a bright wide stroke and no fill, clipped to the arm.
      The outer belly is the part farthest from center — we want the
      highlight on the convex (outer) side, not the concave (inner) side.
      Shift the path slightly outward by applying a small scale from center.
    -->
